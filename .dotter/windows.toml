[yazi.files]
yazi = "~/AppData/Roaming/yazi/config"

[helix.files]
helix = "~/AppData/Roaming/helix"

[gh.files]
gh = "~/AppData/Roaming/GitHub CLI"

[lazygit.files]
lazygit = "~/AppData/Roaming/lazygit"

[yasb.files]
yasb = "~/.config/yasb"

[komorebi.files]
komorebi = "~/"

[whkd.files]
whkd = "~/.config"

[wezterm.files]
wezterm = "~"

[windows-terminal.files]
"windows terminal/settings.json" = "~/AppData/Local/Packages/Microsoft.WindowsTerminal_8wekyb3d8bbwe/LocalState/settings.json"

# Deploys the whole directory, so secrets.ps1 (git-ignored) sits beside the
# profile where it expects to find it.
[powershell.files]
powershell = "~/Documents/PowerShell"

[ohmyposh.files]
ohmyposh = "~/.omp"
